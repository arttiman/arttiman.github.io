<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Bibliothèque</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F0E0C;
  --bg2: #1A1916;
  --bg3: #232118;
  --card: #1E1D1A;
  --border: #2E2C27;
  --border2: #3A3830;
  --text: #F0EDE6;
  --text2: #A89F8C;
  --text3: #6B6355;
  --gold: #C9A84C;
  --gold2: #E8C97A;
  --green: #4A8C6F;
  --green-bg: #1A2E24;
  --green-text: #7EC8A4;
  --blue: #3A6EA8;
  --blue-bg: #1A2540;
  --blue-text: #7AAEE8;
  --purple-bg: #231A38;
  --purple-text: #B09AE0;
  --red: #C04A4A;
  --red-bg: #2E1A1A;
  --red-text: #F09090;
  --amber-bg: #2E2210;
  --amber-text: #E0B060;
  --radius: 8px;
  --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--gold2);
  padding: 1rem 0;
  letter-spacing: 0.01em;
}
.logo span { color: var(--text3); font-size: 14px; font-family: 'DM Sans', sans-serif; margin-left: 8px; }
.nav { display: flex; gap: 0; }
.nav-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 20px;
  background: transparent;
  color: var(--text3);
  border: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  position: relative;
}
.nav-btn:hover { color: var(--text2); }
.nav-btn.on { color: var(--gold2); border-bottom-color: var(--gold); }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--red); color: #fff;
  font-size: 10px; font-weight: 600;
  margin-left: 6px; vertical-align: middle;
}
.container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
}
.stat-val { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--gold2); }
.stat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
.prog-wrap { margin-bottom: 1.5rem; }
.prog-bar { background: var(--bg3); border-radius: 99px; height: 6px; overflow: hidden; margin-top: 8px; }
.prog-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .8s ease; }
.prog-label { font-size: 12px; color: var(--text3); display: flex; justify-content: space-between; }
.controls { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.sinput {
  flex: 1; min-width: 160px;
  padding: 9px 14px;
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.sinput:focus { border-color: var(--gold); }
.sinput::placeholder { color: var(--text3); }
.fbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.fb {
  font-size: 11px; font-family: 'DM Sans', sans-serif;
  padding: 5px 12px; border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text3);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.fb:hover { border-color: var(--border); color: var(--text2); }
.fb.on { background: var(--bg3); color: var(--gold2); border-color: var(--gold); }
.cnt { font-size: 12px; color: var(--text3); margin-bottom: .75rem; }
.add-btn {
  font-size: 12px; font-family: 'DM Sans', sans-serif;
  padding: 8px 16px;
  background: var(--gold);
  color: var(--bg);
  border: none; border-radius: var(--radius);
  cursor: pointer; font-weight: 500;
  transition: background 0.2s;
}
.add-btn:hover { background: var(--gold2); }
.saving { font-size: 11px; color: var(--green-text); opacity: 0; transition: opacity .3s; }
.saving.show { opacity: 1; }
.add-form {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 1.5rem;
  display: none;
}
.add-form.open { display: block; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.add-row input, .add-row select {
  flex: 1; min-width: 120px;
  padding: 8px 12px; font-size: 13px; font-family: 'DM Sans', sans-serif;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius); color: var(--text); outline: none;
}
.add-row select option { background: var(--bg2); }
.btn-primary {
  background: var(--green); color: #fff; border: none;
  padding: 8px 16px; border-radius: var(--radius);
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; font-weight: 500;
}
.book-list { display: flex; flex-direction: column; gap: 6px; }
.book-card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.15s;
}
.book-card:hover { border-color: var(--border2); }
.book-card.done { border-color: var(--green); background: var(--green-bg); }
.book-card.done .bt { color: var(--green-text); }
.book-card.done .ba { color: #4A9E7A; }
.book-card.current { border-color: var(--blue); background: var(--blue-bg); }
.book-card.current .bt { color: var(--blue-text); }
.bt { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
.ba { font-size: 11px; color: var(--text3); margin-top: 2px; }
.meta { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.pill {
  display: inline-block; font-size: 10px;
  padding: 2px 8px; border-radius: 99px;
  font-weight: 500; letter-spacing: 0.02em;
}
.p-t { background: var(--green-bg); color: var(--green-text); border: 1px solid #2A5040; }
.p-c { background: var(--blue-bg); color: var(--blue-text); border: 1px solid #253555; }
.p-e { background: var(--purple-bg); color: var(--purple-text); border: 1px solid #302045; }
.p-top { background: var(--amber-bg); color: var(--amber-text); border: 1px solid #403015; }
.p-src { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
.p-due { background: var(--red-bg); color: var(--red-text); border: 1px solid #402020; }
.p-up { background: var(--amber-bg); color: var(--amber-text); border: 1px solid #403015; }
.p-ok { background: var(--green-bg); color: var(--green-text); border: 1px solid #2A5040; }
.p-ign { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
.actions { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; margin-left: auto; }
.btn-sm {
  font-size: 11px; font-family: 'DM Sans', sans-serif;
  padding: 4px 10px; border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text3);
  cursor: pointer; white-space: nowrap;
  transition: all 0.15s;
}
.btn-sm:hover { border-color: var(--border); color: var(--text2); }
.btn-rev {
  background: var(--green-bg); color: var(--green-text);
  border-color: var(--green);
}
.btn-rev:hover { background: #1F3830; }
.rev-section { margin-bottom: 2rem; }
.rev-title {
  font-size: 11px; font-weight: 500; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.rev-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.rev-n {
  font-family: 'Playfair Display', serif;
  font-size: 12px; color: var(--text3);
  min-width: 30px;
}
.ignored-row { opacity: 0.4; }
.empty-state {
  text-align: center; padding: 3rem 1rem;
  color: var(--text3); font-size: 14px;
}
.empty-state .ico { font-size: 32px; margin-bottom: 8px; }
.header-right { display: flex; align-items: center; gap: 12px; padding: 8px 0; }

/* Rev cards */
.rev-card-due { border-color: var(--red) !important; background: var(--red-bg) !important; }
.rev-card-due .bt { color: var(--red-text) !important; }
.rev-card-upcoming { border-color: var(--gold) !important; background: var(--amber-bg) !important; }
.rev-card-upcoming .bt { color: var(--amber-text) !important; }

@media (max-width: 600px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .container { padding: 1rem; }
  .header { padding: 0 1rem; }
}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:1.5rem">
    <div class="logo">Ma Bibliothèque<span id="book-count"></span></div>
    <div class="nav">
      <button class="nav-btn on" id="tab-lib" onclick="showTab('lib')">Bibliothèque</button>
      <button class="nav-btn" id="tab-rev" onclick="showTab('rev')">Révisions <span class="badge" id="badge-rev" style="display:none">0</span></button>
    </div>
  </div>
  <div class="header-right">
    <span class="saving" id="saving">✓ Sauvegardé</span>
    <button class="add-btn" onclick="toggleAdd()" id="btn-add">+ Ajouter un livre</button>
  </div>
</div>

<div class="container">

<div id="view-lib">
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">livres suivis</div></div>
    <div class="stat"><div class="stat-val" id="s-done">—</div><div class="stat-lbl">terminés</div></div>
    <div class="stat"><div class="stat-val" id="s-cur">—</div><div class="stat-lbl">en cours</div></div>
    <div class="stat"><div class="stat-val" id="s-top">—</div><div class="stat-lbl">top 100 lus</div></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-label"><span>Progression top 100</span><span id="prog-txt">0 / 100</span></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div class="add-form" id="add-form">
    <div class="add-row">
      <input id="f-titre" placeholder="Titre *" style="flex:2">
      <input id="f-auteur" placeholder="Auteur">
      <input id="f-annee" placeholder="Année" style="max-width:90px">
    </div>
    <div class="add-row">
      <select id="f-etat"><option value="Envie">Envie de lire</option><option value="En cours">En cours</option><option value="Terminé">Terminé</option></select>
      <select id="f-support"><option value="">Support</option><option value="Papier">Papier</option><option value="ebook">ebook</option><option value="Audio">Audio</option></select>
      <button class="btn-primary" onclick="addBook()">Ajouter</button>
    </div>
  </div>

  <div class="controls">
    <input class="sinput" id="search" placeholder="Chercher un titre ou un auteur…" oninput="renderLib()">
    <div class="fbtns" id="fbtns"></div>
  </div>
  <div class="cnt" id="cnt"></div>
  <div class="book-list" id="list"></div>
</div>

<div id="view-rev" style="display:none">
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="r-due">—</div><div class="stat-lbl">à réviser aujourd'hui</div></div>
    <div class="stat"><div class="stat-val" id="r-week">—</div><div class="stat-lbl">cette semaine</div></div>
    <div class="stat"><div class="stat-val" id="r-total">—</div><div class="stat-lbl">révisions faites</div></div>
    <div class="stat"><div class="stat-val" id="r-fin">—</div><div class="stat-lbl">cycles terminés</div></div>
  </div>
  <div id="rev-list"></div>
</div>

</div>

let books = [], libFilter = "tous", addOpen = false, showIgnored = false;
const today = new Date(); today.setHours(0,0,0,0);
const todayStr = today.toISOString().slice(0,10);

function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fmtDate(s){if(!s)return"—";const d=new Date(s);return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});}
function revDesc(n){return["Relire ses notes","Résumer de mémoire","Identifier les idées clés","Relier à d'autres lectures","Expliquer à voix haute","Résumé écrit","Relecture partielle","Notes enrichies","Relecture légère","Ancrage final"][n]||"Révision";}
function dedup(list){const seen=new Set(),out=[];for(const b of list){const k=b.t.toLowerCase().replace(/[\s'']/g,"");if(!seen.has(k)){seen.add(k);out.push({...b});}}return out;}

function load(){
  try{
    const raw = localStorage.getItem(SK);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && saved.length > 0){
        const savedMap = new Map(saved.map(b=>[b.id,b]));
        const defIds = new Set(DEF.map(b=>b.id));
        books = dedup(DEF).map(b => savedMap.has(b.id) ? {...b,...savedMap.get(b.id),t:b.t,a:b.a,y:b.y,src:b.src} : b);
        saved.filter(b=>!defIds.has(b.id)).forEach(b=>books.push(b));
        persist();
        refresh();
        setTimeout(()=>{document.getElementById("prog-fill").style.width=topPct()+"%"},300);
        return;
      }
    }
  }catch(e){}
  books = dedup(DEF);
  persist();
  refresh();
  setTimeout(()=>{document.getElementById("prog-fill").style.width=topPct()+"%"},300);
}

function persist(){try{localStorage.setItem(SK,JSON.stringify(books));}catch(e){}}
function save(){persist();const el=document.getElementById("saving");el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2000);refresh();}
function topPct(){return books.filter(b=>TOP100.has(b.t)&&b.e==="Terminé").length;}
function refresh(){updateStats();buildFilters();renderLib();renderRev();}

function updateStats(){
  const done=books.filter(b=>b.e==="Terminé").length;
  const cur=books.filter(b=>b.e==="En cours").length;
  const top=topPct();
  document.getElementById("s-total").textContent=books.length;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-cur").textContent=cur;
  document.getElementById("s-top").textContent=top+"/100";
  document.getElementById("prog-txt").textContent=top+" / 100";
  document.getElementById("prog-fill").style.width=Math.round(top)+"%";
  document.getElementById("book-count").textContent=` · ${books.length} livres`;
  const due=books.filter(b=>b.e==="Terminé"&&!b.ignored&&b.lastRev&&(b.revCount||0)<10&&calcNext(b)<=todayStr).length
            +books.filter(b=>b.e==="Terminé"&&!b.ignored&&!b.lastRev&&b.finDate&&(b.revCount||0)<10&&addDays(b.finDate,1)<=todayStr).length;
  const badge=document.getElementById("badge-rev");
  badge.textContent=due;badge.style.display=due>0?"inline-flex":"none";
  const week=new Date(today);week.setDate(week.getDate()+7);const weekStr=week.toISOString().slice(0,10);
  document.getElementById("r-due").textContent=due;
  const dueWeek=books.filter(b=>{
    if(b.e!=="Terminé"||b.ignored||(b.revCount||0)>=10)return false;
    const n=calcNext(b);return n&&n<=weekStr;
  }).length;
  document.getElementById("r-week").textContent=dueWeek;
  document.getElementById("r-total").textContent=books.reduce((s,b)=>s+(b.revCount||0),0);
  document.getElementById("r-fin").textContent=books.filter(b=>(b.revCount||0)>=10).length;
}

function calcNext(b){
  const rc=b.revCount||0;
  if(rc>=10)return null;
  if(rc===0){return b.finDate?addDays(b.finDate,INTERVALS[0]):null;}
  return b.lastRev?addDays(b.lastRev,INTERVALS[rc]):null;
}

function buildFilters(){
  const fs=[
    {k:"tous",l:`Tous (${books.length})`},
    {k:"Terminé",l:`Terminés (${books.filter(b=>b.e==="Terminé").length})`},
    {k:"En cours",l:`En cours (${books.filter(b=>b.e==="En cours").length})`},
    {k:"Envie",l:`Envie (${books.filter(b=>b.e==="Envie").length})`},
    {k:"top100",l:`Top 100 (${books.filter(b=>TOP100.has(b.t)).length})`},
  ];
  document.getElementById("fbtns").innerHTML=fs.map(f=>`<button class="fb ${f.k===libFilter?"on":""}" onclick="setFilter('${f.k}')">${f.l}</button>`).join("");
}
function setFilter(k){libFilter=k;buildFilters();renderLib();}

function renderLib(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=books.filter(b=>{
    const mf=libFilter==="tous"?true:libFilter==="top100"?TOP100.has(b.t):b.e===libFilter;
    const mq=!q||b.t.toLowerCase().includes(q)||b.a.toLowerCase().includes(q);
    return mf&&mq;
  });
  document.getElementById("cnt").textContent=`${list.length} livre${list.length>1?"s":""}`;
  document.getElementById("list").innerHTML=list.map(b=>{
    const cls=b.e==="Terminé"?"done":b.e==="En cours"?"current":"";
    const inTop=TOP100.has(b.t);const rc=b.revCount||0;
    const next=calcNext(b);
    const isDue=next&&next<=todayStr&&rc<10;
    const isUp=next&&next>todayStr&&next<=addDays(todayStr,7)&&rc<10;
    return `<div class="book-card ${cls}">
      <div style="flex:1;min-width:0">
        <div class="bt">${b.t}</div>
        <div class="ba">${b.a}${b.y?` · ${b.y>0?b.y:Math.abs(b.y)+" av. J.-C."}`:""}</div>
        <div class="meta">
          ${b.e==="Terminé"?'<span class="pill p-t">Terminé</span>':b.e==="En cours"?'<span class="pill p-c">En cours</span>':'<span class="pill p-e">Envie</span>'}
          ${b.s?`<span class="pill p-src">${b.s}</span>`:""}
          ${inTop?'<span class="pill p-top">Top 100</span>':""}
          ${b.ignored?'<span class="pill p-ign">Ignoré</span>':""}
          ${isDue?`<span class="pill p-due">Révision ${rc+1} due</span>`:""}
          ${isUp?`<span class="pill p-up">Rév. ${rc+1} — ${fmtDate(next)}</span>`:""}
          ${rc>=10?'<span class="pill p-ok">Cycle complet</span>':""}
        </div>
      </div>
      <div class="actions">
        ${b.e!=="Terminé"?`<button class="btn-sm" onclick="markDone('${b.id}')">Lu ✓</button>`:""}
        ${b.e!=="En cours"?`<button class="btn-sm" onclick="setState('${b.id}','En cours')">En cours</button>`:""}
        ${b.e!=="Envie"?`<button class="btn-sm" onclick="setState('${b.id}','Envie')">Envie</button>`:""}
      </div>
    </div>`;
  }).join("");
}

function renderRev(){
  const week=addDays(todayStr,7);
  const termine=books.filter(b=>b.e==="Terminé"&&!b.ignored);
  const withNext=termine.filter(b=>{const n=calcNext(b);return n&&(b.revCount||0)<10;});
  const due=withNext.filter(b=>calcNext(b)<=todayStr).sort((a,b)=>calcNext(a).localeCompare(calcNext(b)));
  const upcoming=withNext.filter(b=>calcNext(b)>todayStr&&calcNext(b)<=week).sort((a,b)=>calcNext(a).localeCompare(calcNext(b)));
  const later=withNext.filter(b=>calcNext(b)>week).sort((a,b)=>calcNext(a).localeCompare(calcNext(b)));
  const toStart=termine.filter(b=>!calcNext(b)&&(b.revCount||0)<10);
  const ignored=books.filter(b=>b.e==="Terminé"&&b.ignored);
  let html="";
  if(!due.length&&!upcoming.length&&!later.length&&!toStart.length){
    html=`<div class="empty-state"><div class="ico">📚</div>Aucune révision en cours.<br>Marque un livre comme terminé pour démarrer son cycle.</div>`;
  }
  if(due.length)html+=revSection("À réviser aujourd'hui",due,"due");
  if(upcoming.length)html+=revSection("Cette semaine",upcoming,"upcoming");
  if(later.length)html+=revSection("À venir",later,"later");
  if(toStart.length)html+=startSection(toStart);
  if(ignored.length)html+=ignoredSection(ignored);
  document.getElementById("rev-list").innerHTML=html;
}

function revSection(title,list,type){
  return `<div class="rev-section"><div class="rev-title">${title} (${list.length})</div><div class="book-list">${list.map(b=>revCard(b,type)).join("")}</div></div>`;
}
function revCard(b,type){
  const rc=b.revCount||0;
  const next=calcNext(b);
  const cls=type==="due"?"rev-card-due":type==="upcoming"?"rev-card-upcoming":"";
  return `<div class="book-card ${cls}">
    <div class="rev-n">${rc}/10</div>
    <div style="flex:1;min-width:0">
      <div class="bt">${b.t}</div>
      <div class="ba">${b.a} · ${revDesc(rc)}</div>
      <div class="meta">
        <span class="pill ${type==="due"?"p-due":type==="upcoming"?"p-up":"p-src"}">${type==="due"?"En retard depuis le "+fmtDate(next):"Prévue le "+fmtDate(next)}</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn-sm btn-rev" onclick="markRev('${b.id}')">Révision ${rc+1} faite ✓</button>
    </div>
  </div>`;
}
function startSection(list){
  return `<div class="rev-section"><div class="rev-title">Démarrer le cycle (${list.length})</div><div class="book-list">${list.map(b=>`
    <div class="book-card">
      <div class="rev-n">0/10</div>
      <div style="flex:1;min-width:0"><div class="bt">${b.t}</div><div class="ba">${b.a}</div></div>
      <div class="actions">
        <button class="btn-sm btn-rev" onclick="startCycle('${b.id}')">Démarrer</button>
        <button class="btn-sm" onclick="ignoreBook('${b.id}')">Ignorer</button>
      </div>
    </div>`).join("")}</div></div>`;
}
function ignoredSection(list){
  return `<div class="rev-section"><div class="rev-title" onclick="toggleIgnored()" style="cursor:pointer">Ignorés (${list.length}) <span style="font-size:10px;opacity:.5">${showIgnored?"▲":"▼"}</span></div>${showIgnored?`<div class="book-list">${list.map(b=>`<div class="book-card ignored-row"><div style="flex:1"><div class="bt">${b.t}</div><div class="ba">${b.a}</div></div><div class="actions"><button class="btn-sm" onclick="unignoreBook('${b.id}')">Réactiver</button></div></div>`).join("")}</div>`:""}</div>`;
}

function markDone(id){const b=books.find(x=>x.id===id);if(!b)return;b.e="Terminé";b.finDate=todayStr;b.revCount=0;b.lastRev=null;delete b.ignored;save();}
function setState(id,e){const b=books.find(x=>x.id===id);if(!b)return;b.e=e;save();}
function startCycle(id){const b=books.find(x=>x.id===id);if(!b)return;b.finDate=b.finDate||todayStr;b.revCount=0;b.lastRev=null;save();}
function markRev(id){const b=books.find(x=>x.id===id);if(!b)return;b.revCount=(b.revCount||0)+1;b.lastRev=todayStr;save();}
function ignoreBook(id){const b=books.find(x=>x.id===id);if(!b)return;b.ignored=true;save();}
function unignoreBook(id){const b=books.find(x=>x.id===id);if(!b)return;delete b.ignored;save();}
function toggleIgnored(){showIgnored=!showIgnored;renderRev();}
function showTab(tab){
  document.getElementById("view-lib").style.display=tab==="lib"?"block":"none";
  document.getElementById("view-rev").style.display=tab==="rev"?"block":"none";
  document.getElementById("tab-lib").classList.toggle("on",tab==="lib");
  document.getElementById("tab-rev").classList.toggle("on",tab==="rev");
  document.getElementById("btn-add").style.display=tab==="lib"?"":"none";
}
function toggleAdd(){addOpen=!addOpen;document.getElementById("add-form").classList.toggle("open",addOpen);}
function addBook(){
  const t=document.getElementById("f-titre").value.trim();if(!t)return;
  const a=document.getElementById("f-auteur").value.trim();
  const y=parseInt(document.getElementById("f-annee").value)||null;
  const e=document.getElementById("f-etat").value;
  const s=document.getElementById("f-support").value;
  const nb={id:"u-"+Date.now(),t,a,y,e,s,src:"ajouté"};
  if(e==="Terminé"){nb.finDate=todayStr;nb.revCount=0;nb.lastRev=null;}
  books.unshift(nb);
  document.getElementById("f-titre").value="";document.getElementById("f-auteur").value="";document.getElementById("f-annee").value="";
  save();
}
load();
</script>
