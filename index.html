<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Bibliothèque</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F1;--bg2:#FFFFFF;--bg3:#EEECEA;--card:#FFFFFF;--border:#E2E0DC;--border2:#D0CEC9;--text:#1A1917;--text2:#5C5750;--text3:#9C9589;--accent:#2D6A4F;--accent2:#40916C;--green-bg:#EAF4EE;--green-text:#1E5C3A;--green-bd:#B7D9C4;--blue-bg:#EAF0FA;--blue-text:#1E3F6E;--blue-bd:#B7CCE8;--purple-bg:#F0EEFA;--purple-text:#3D2878;--purple-bd:#C9BCF0;--red:#C0392B;--red-bg:#FDF0EE;--red-text:#8B1A10;--red-bd:#F0BDB7;--amber-bg:#FDF6E8;--amber-text:#7A4F00;--amber-bd:#EDD99A;--gray-bg:#F2F1EF;--gray-text:#6B6560;--gray-bd:#D8D6D1;--sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--sh-md:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.05);--r:8px;--r-lg:12px;--font:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 2rem;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;box-shadow:var(--sh)}
.logo{font-size:16px;font-weight:600;color:var(--text);padding:1rem 0;letter-spacing:-.01em}
.logo-sub{font-size:12px;font-weight:400;color:var(--text3);margin-left:8px}
.nav{display:flex}
.nav-btn{font-family:var(--font);font-size:13px;font-weight:500;padding:8px 18px;background:transparent;color:var(--text3);border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.nav-btn:hover{color:var(--text2)}
.nav-btn.on{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:600;margin-left:5px;vertical-align:middle}
.hdr-r{display:flex;align-items:center;gap:10px;padding:8px 0}
.saving{font-size:11px;color:var(--accent2);opacity:0;transition:opacity .3s}
.saving.show{opacity:1}
.btn{font-family:var(--font);font-size:13px;font-weight:500;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s;padding:8px 14px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{background:var(--bg3)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.btn-danger:hover{background:#f8e0dd}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;font-family:var(--font);white-space:nowrap;transition:all .15s}
.btn-sm:hover{background:var(--bg3)}
.btn-sm.green{background:var(--green-bg);color:var(--green-text);border-color:var(--green-bd)}
.btn-sm.green:hover{background:#dcede5}
.ctr{max-width:1000px;margin:0 auto;padding:1.5rem}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh)}
.stat-val{font-size:24px;font-weight:600;color:var(--text);letter-spacing:-.02em}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.ctrl{display:flex;gap:8px;margin-bottom:.6rem;flex-wrap:wrap;align-items:center}
.sinput{flex:1;min-width:160px;padding:8px 12px;font-size:13px;font-family:var(--font);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);outline:none;transition:border-color .15s;box-shadow:var(--sh)}
.sinput:focus{border-color:var(--accent)}
.sinput::placeholder{color:var(--text3)}
.sort-sel{padding:8px 12px;font-size:12px;font-family:var(--font);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text2);outline:none;cursor:pointer;box-shadow:var(--sh)}
.fbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem}
.fb{font-size:11px;font-family:var(--font);font-weight:500;padding:4px 11px;border-radius:99px;border:1px solid var(--border2);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap}
.fb:hover{color:var(--text2);background:var(--bg3)}
.fb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cnt{font-size:12px;color:var(--text3);margin-bottom:.5rem}
.add-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:1.25rem;display:none;box-shadow:var(--sh)}
.add-form.open{display:block}
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.add-row input,.add-row select{flex:1;min-width:120px;padding:8px 11px;font-size:13px;font-family:var(--font);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text);outline:none}
.add-row input:focus,.add-row select:focus{border-color:var(--accent);background:var(--bg2)}
.lbl-mgr{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:1.25rem;display:none;box-shadow:var(--sh)}
.lbl-mgr.open{display:block}
.lbl-mgr-hd{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;margin-bottom:10px}
.lbl-list{display:flex;flex-wrap:wrap;gap:6px}
.lbl-chip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;border:1px solid var(--gray-bd);background:var(--gray-bg);color:var(--gray-text)}
.lbl-del{cursor:pointer;color:var(--text3);margin-left:2px}
.lbl-del:hover{color:var(--red)}
.new-lbl{display:flex;gap:6px;margin-top:10px}
.new-lbl input{flex:1;padding:6px 10px;font-size:12px;font-family:var(--font);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text);outline:none}
.new-lbl input:focus{border-color:var(--accent)}
.blist{display:flex;flex-direction:column;gap:5px}
.bcard{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);transition:border-color .15s}
.bcard:hover{border-color:var(--border2)}
.bcard.done{border-color:var(--green-bd);background:var(--green-bg)}
.bcard.done .bt{color:var(--green-text)}
.bcard.done .ba{color:#3A7A58}
.bcard.cur{border-color:var(--blue-bd);background:var(--blue-bg)}
.bcard.cur .bt{color:var(--blue-text)}
.bcard.rdue{border-color:var(--red-bd);background:var(--red-bg)}
.bcard.rdue .bt{color:var(--red-text)}
.bcard.rup{border-color:var(--amber-bd);background:var(--amber-bg)}
.bcard.rup .bt{color:var(--amber-text)}
.bcard.ign{opacity:.5}
.bt{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
.ba{font-size:11px;color:var(--text3);margin-top:2px}
.meta{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid transparent}
.p-t{background:var(--green-bg);color:var(--green-text);border-color:var(--green-bd)}
.p-c{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-bd)}
.p-e{background:var(--purple-bg);color:var(--purple-text);border-color:var(--purple-bd)}
.p-l{background:var(--gray-bg);color:var(--gray-text);border-color:var(--gray-bd)}
.p-due{background:var(--red-bg);color:var(--red-text);border-color:var(--red-bd)}
.p-up{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-bd)}
.p-ok{background:var(--green-bg);color:var(--green-text);border-color:var(--green-bd)}
.p-ign{background:var(--gray-bg);color:var(--text3);border-color:var(--gray-bd)}
.acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;margin-left:auto;align-items:flex-start}
.rev-n{font-size:11px;font-weight:600;color:var(--text3);min-width:30px;padding-top:2px}
.rsect{margin-bottom:1.75rem}
.rtitle{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.rtitle::after{content:'';flex:1;height:1px;background:var(--border)}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:500;backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 11px;font-size:13px;font-family:var(--font);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);background:var(--bg2)}
.mfooter{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}
.mfooter-r{display:flex;gap:8px}
.echips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.echip{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .15s}
.echip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.echip:hover:not(.on){background:var(--bg2)}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}.ctr{padding:1rem}.hdr{padding:0 1rem}}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
    <div class="logo">Ma Bibliothèque <span class="logo-sub" id="bcount"></span></div>
    <div class="nav">
      <button class="nav-btn on" id="tab-lib" onclick="showTab('lib')">Bibliothèque</button>
      <button class="nav-btn" id="tab-rev" onclick="showTab('rev')">Révisions <span class="badge" id="badge" style="display:none">0</span></button>
    </div>
  </div>
  <div class="hdr-r">
    <span class="saving" id="saving">✓ Sauvegardé</span>
    <button class="btn btn-primary" onclick="toggleAdd()" id="btn-add">+ Ajouter</button>
  </div>
</div>

<div class="ctr">
<div id="view-lib">
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">livres suivis</div></div>
    <div class="stat"><div class="stat-val" id="s-done">—</div><div class="stat-lbl">terminés</div></div>
    <div class="stat"><div class="stat-val" id="s-cur">—</div><div class="stat-lbl">en cours</div></div>
  </div>
  <div class="lbl-mgr" id="lbl-mgr">
    <div class="lbl-mgr-hd"><span>Gérer les labels</span><span style="cursor:pointer" onclick="toggleLblMgr()">✕</span></div>
    <div class="lbl-list" id="lbl-list"></div>
    <div class="new-lbl"><input id="new-lbl-in" placeholder="Nouveau label…" onkeydown="if(event.key==='Enter')addLbl()"><button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="addLbl()">Ajouter</button></div>
  </div>
  <div class="add-form" id="add-form">
    <div class="add-row"><input id="f-t" placeholder="Titre *" style="flex:2"><input id="f-a" placeholder="Auteur"><input id="f-y" placeholder="Année" style="max-width:90px"></div>
    <div class="add-row">
      <select id="f-e"><option value="Envie">Envie de lire</option><option value="En cours">En cours</option><option value="Terminé">Terminé</option></select>
      <select id="f-s"><option value="">Support</option><option value="Papier">Papier</option><option value="ebook">ebook</option><option value="Audio">Audio</option></select>
      <button class="btn btn-primary" onclick="addBook()">Ajouter</button>
    </div>
  </div>
  <div class="ctrl">
    <input class="sinput" id="search" placeholder="Chercher titre ou auteur…" oninput="renderLib()">
    <select class="sort-sel" id="sort-sel" onchange="renderLib()">
      <option value="default">Tri par défaut</option>
      <option value="az">Titre A → Z</option>
      <option value="za">Titre Z → A</option>
      <option value="author">Auteur A → Z</option>
      <option value="year-asc">Année ↑</option>
      <option value="year-desc">Année ↓</option>
      <option value="recent">Récemment ajouté</option>
    </select>
    <button class="btn btn-ghost" style="font-size:12px;padding:7px 12px" onclick="toggleLblMgr()">🏷 Labels</button>
  </div>
  <div class="fbtns" id="fbtns"></div>
  <div class="cnt" id="cnt"></div>
  <div class="blist" id="blist"></div>
</div>

<div id="view-rev" style="display:none">
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="r-due">—</div><div class="stat-lbl">à réviser aujourd'hui</div></div>
    <div class="stat"><div class="stat-val" id="r-week">—</div><div class="stat-lbl">cette semaine</div></div>
    <div class="stat"><div class="stat-val" id="r-tot">—</div><div class="stat-lbl">révisions faites</div></div>
  </div>
  <div id="rev-list"></div>
</div>
</div>

<div class="overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Modifier le livre</h3>
    <div class="field"><label>Titre</label><input id="e-t"></div>
    <div class="field"><label>Auteur</label><input id="e-a"></div>
    <div class="field"><label>Année</label><input id="e-y" type="number"></div>
    <div class="field"><label>Statut</label><select id="e-e"><option value="Envie">Envie de lire</option><option value="En cours">En cours</option><option value="Terminé">Terminé</option></select></div>
    <div class="field"><label>Support</label><select id="e-s"><option value="">—</option><option value="Papier">Papier</option><option value="ebook">ebook</option><option value="Audio">Audio</option></select></div>
    <div class="field"><label>Labels</label><div class="echips" id="e-lbls"></div></div>
    <div class="mfooter">
      <button class="btn btn-danger" onclick="delBook()">Supprimer</button>
      <div class="mfooter-r"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveEdit()">Enregistrer</button></div>
    </div>
  </div>
</div>

let books=[],labels=[...DEF_L],flt="tous",lbl=null,addOpen=false,showIgn=false,editId=null,lmOpen=false;
const now=new Date();now.setHours(0,0,0,0);const tod=now.toISOString().slice(0,10);
function ad(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);}
function fd(s){if(!s)return"—";return new Date(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});}
function rdesc(n){return["Relire ses notes","Résumer de mémoire","Identifier les idées clés","Relier à d'autres lectures","Expliquer à voix haute","Résumé écrit","Relecture partielle","Notes enrichies","Relecture légère","Ancrage final"][n]||"";}
function dd(list){const s=new Set(),o=[];for(const b of list){const k=b.t.toLowerCase().replace(/[\s'']/g,"");if(!s.has(k)){s.add(k);o.push({...b});}}return o;}
function nx(b){const r=b.rc||0;if(r>=10)return null;if(r===0)return b.fd?ad(b.fd,IV[0]):null;return b.lr?ad(b.lr,IV[r]):null;}

function load(){
  try{const raw=localStorage.getItem(SK);if(raw){const d=JSON.parse(raw);if(d){books=d.books||[];labels=d.labels||[...DEF_L];merge();persist();refresh();return;}}}catch(e){}
  books=dd(DEF);persist();refresh();
}
function merge(){
  const m=new Map(books.map(b=>[b.id,b]));const di=new Set(DEF.map(b=>b.id));
  const db=dd(DEF).map(b=>m.has(b.id)?{...b,...m.get(b.id),t:b.t,a:b.a}:b);
  const ex=books.filter(b=>!di.has(b.id));books=[...db,...ex];
}
function persist(){try{localStorage.setItem(SK,JSON.stringify({books,labels}));}catch(e){}}
function save(){persist();const el=document.getElementById("saving");el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2000);refresh();}
function refresh(){stats();filters();renderLib();renderRev();renderLM();}

function stats(){
  const done=books.filter(b=>b.e==="Terminé").length;
  const cur=books.filter(b=>b.e==="En cours").length;
  document.getElementById("s-total").textContent=books.length;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-cur").textContent=cur;
  document.getElementById("bcount").textContent=books.length+" livres";
  const due=books.filter(b=>{if(b.e!=="Terminé"||b.ig||(b.rc||0)>=10)return false;const n=nx(b);return n&&n<=tod;}).length;
  const badge=document.getElementById("badge");
  badge.textContent=due;badge.style.display=due>0?"inline-flex":"none";
  const wk=ad(tod,7);
  document.getElementById("r-due").textContent=due;
  document.getElementById("r-week").textContent=books.filter(b=>{if(b.e!=="Terminé"||b.ig||(b.rc||0)>=10)return false;const n=nx(b);return n&&n<=wk;}).length;
  document.getElementById("r-tot").textContent=books.reduce((s,b)=>s+(b.rc||0),0);
}

function filters(){
  const ss=[
    {k:"tous",l:`Tous (${books.length})`},
    {k:"Terminé",l:`Terminés (${books.filter(b=>b.e==="Terminé").length})`},
    {k:"En cours",l:`En cours (${books.filter(b=>b.e==="En cours").length})`},
    {k:"Envie",l:`Envie (${books.filter(b=>b.e==="Envie").length})`}
  ];
  const lb=labels.map(l=>{const c=books.filter(b=>(b.L||[]).includes(l)).length;return`<button class="fb ${lbl===l?"on":""}" onclick="setLbl('${l}')">${l} (${c})</button>`;});
  document.getElementById("fbtns").innerHTML=
    ss.map(f=>`<button class="fb ${f.k===flt&&!lbl?"on":""}" onclick="setFlt('${f.k}')">${f.l}</button>`).join("")+
    '<span style="color:var(--border2);margin:0 4px;align-self:center">|</span>'+lb.join("");
}
function setFlt(k){flt=k;lbl=null;filters();renderLib();}
function setLbl(l){lbl=lbl===l?null:l;flt="tous";filters();renderLib();}

function srt(list){
  const v=document.getElementById("sort-sel").value;const c=[...list];
  if(v==="az")c.sort((a,b)=>a.t.localeCompare(b.t,"fr"));
  else if(v==="za")c.sort((a,b)=>b.t.localeCompare(a.t,"fr"));
  else if(v==="author")c.sort((a,b)=>(a.a||"").localeCompare(b.a||"","fr"));
  else if(v==="year-asc")c.sort((a,b)=>(a.y||9999)-(b.y||9999));
  else if(v==="year-desc")c.sort((a,b)=>(b.y||0)-(a.y||0));
  else if(v==="recent")c.reverse();
  return c;
}

function renderLib(){
  const q=document.getElementById("search").value.toLowerCase();
  let list=books.filter(b=>{
    const ms=flt==="tous"?true:b.e===flt;
    const ml=!lbl||(b.L||[]).includes(lbl);
    const mq=!q||b.t.toLowerCase().includes(q)||(b.a||"").toLowerCase().includes(q);
    return ms&&ml&&mq;
  });
  list=srt(list);
  document.getElementById("cnt").textContent=`${list.length} livre${list.length>1?"s":""}`;
  document.getElementById("blist").innerHTML=list.map(b=>{
    const cls=b.e==="Terminé"?"done":b.e==="En cours"?"cur":"";
    const r=b.rc||0;const n=nx(b);
    const isD=n&&n<=tod&&r<10;const isU=n&&n>tod&&n<=ad(tod,7)&&r<10;
    const lbs=(b.L||[]).map(l=>`<span class="pill p-l">${l}</span>`).join("");
    return `<div class="bcard ${cls}">
      <div style="flex:1;min-width:0">
        <div class="bt">${b.t}</div>
        <div class="ba">${b.a||""}${b.y?` · ${b.y>0?b.y:Math.abs(b.y)+" av. J.-C."}`:""}</div>
        <div class="meta">
          ${b.e==="Terminé"?'<span class="pill p-t">Terminé</span>':b.e==="En cours"?'<span class="pill p-c">En cours</span>':'<span class="pill p-e">Envie</span>'}
          ${b.s?`<span class="pill p-l">${b.s}</span>`:""}${lbs}
          ${b.ig?'<span class="pill p-ign">Ignoré (rév.)</span>':""}
          ${isD?`<span class="pill p-due">Révision ${r+1} due</span>`:""}
          ${isU?`<span class="pill p-up">Rév. ${r+1} — ${fd(n)}</span>`:""}
          ${r>=10?'<span class="pill p-ok">Cycle complet</span>':""}
        </div>
      </div>
      <div class="acts">
        ${b.e!=="Terminé"?`<button class="btn-sm green" onclick="markDone('${b.id}')">Lu ✓</button>`:""}
        ${b.e!=="En cours"?`<button class="btn-sm" onclick="setSt('${b.id}','En cours')">En cours</button>`:""}
        ${b.e!=="Envie"?`<button class="btn-sm" onclick="setSt('${b.id}','Envie')">Envie</button>`:""}
        <button class="btn-sm" onclick="openEdit('${b.id}')">✏︎</button>
      </div>
    </div>`;
  }).join("");
}

function renderRev(){
  const wk=ad(tod,7);
  const wn=books.filter(b=>b.e==="Terminé"&&!b.ig&&(b.rc||0)<10&&nx(b));
  const due=wn.filter(b=>nx(b)<=tod).sort((a,b)=>nx(a).localeCompare(nx(b)));
  const up=wn.filter(b=>nx(b)>tod&&nx(b)<=wk).sort((a,b)=>nx(a).localeCompare(nx(b)));
  const later=wn.filter(b=>nx(b)>wk).sort((a,b)=>nx(a).localeCompare(nx(b)));
  const ts=books.filter(b=>b.e==="Terminé"&&!b.ig&&!nx(b)&&(b.rc||0)<10);
  const ig=books.filter(b=>b.e==="Terminé"&&b.ig);
  let h="";
  if(!due.length&&!up.length&&!later.length&&!ts.length)h='<div class="empty">📚 Aucune révision en cours.</div>';
  if(due.length)h+=rsect("À réviser aujourd'hui",due,"due");
  if(up.length)h+=rsect("Cette semaine",up,"up");
  if(later.length)h+=rsect("À venir",later,"later");
  if(ts.length)h+=ssect(ts);
  if(ig.length)h+=isect(ig);
  document.getElementById("rev-list").innerHTML=h;
}

function rsect(ti,list,tp){return`<div class="rsect"><div class="rtitle">${ti} (${list.length})</div><div class="blist">${list.map(b=>rcard(b,tp)).join("")}</div></div>`;}
function rcard(b,tp){
  const r=b.rc||0;const n=nx(b);
  const cls=tp==="due"?"rdue":tp==="up"?"rup":"";
  return`<div class="bcard ${cls}"><div class="rev-n">${r}/10</div>
    <div style="flex:1;min-width:0"><div class="bt">${b.t}</div><div class="ba">${b.a} · ${rdesc(r)}</div>
    <div class="meta"><span class="pill ${tp==="due"?"p-due":tp==="up"?"p-up":"p-l"}">${tp==="due"?"En retard — "+fd(n):"Prévue le "+fd(n)}</span></div></div>
    <div class="acts"><button class="btn-sm green" onclick="markRev('${b.id}')">Révision ${r+1} faite ✓</button></div>
  </div>`;
}
function ssect(list){return`<div class="rsect"><div class="rtitle">Démarrer le cycle (${list.length})</div><div class="blist">${list.map(b=>`<div class="bcard"><div class="rev-n">0/10</div><div style="flex:1;min-width:0"><div class="bt">${b.t}</div><div class="ba">${b.a}</div></div><div class="acts"><button class="btn-sm green" onclick="startCyc('${b.id}')">Démarrer</button><button class="btn-sm" onclick="ignB('${b.id}')">Ignorer</button></div></div>`).join("")}</div></div>`;}
function isect(list){return`<div class="rsect"><div class="rtitle" onclick="showIgn=!showIgn;renderRev()" style="cursor:pointer">Ignorés (${list.length}) ${showIgn?"▲":"▼"}</div>${showIgn?`<div class="blist">${list.map(b=>`<div class="bcard ign"><div style="flex:1"><div class="bt">${b.t}</div><div class="ba">${b.a}</div></div><div class="acts"><button class="btn-sm" onclick="unignB('${b.id}')">Réactiver</button></div></div>`).join("")}</div>`:""}</div>`;}

function markDone(id){const b=books.find(x=>x.id===id);if(!b)return;b.e="Terminé";b.fd=tod;b.rc=0;b.lr=null;delete b.ig;save();}
function setSt(id,e){const b=books.find(x=>x.id===id);if(!b)return;b.e=e;save();}
function startCyc(id){const b=books.find(x=>x.id===id);if(!b)return;b.fd=b.fd||tod;b.rc=0;b.lr=null;save();}
function markRev(id){const b=books.find(x=>x.id===id);if(!b)return;b.rc=(b.rc||0)+1;b.lr=tod;save();}
function ignB(id){const b=books.find(x=>x.id===id);if(!b)return;b.ig=true;save();}
function unignB(id){const b=books.find(x=>x.id===id);if(!b)return;delete b.ig;save();}

function showTab(tab){
  document.getElementById("view-lib").style.display=tab==="lib"?"block":"none";
  document.getElementById("view-rev").style.display=tab==="rev"?"block":"none";
  document.getElementById("tab-lib").classList.toggle("on",tab==="lib");
  document.getElementById("tab-rev").classList.toggle("on",tab==="rev");
  document.getElementById("btn-add").style.display=tab==="lib"?"":"none";
}
function toggleAdd(){addOpen=!addOpen;document.getElementById("add-form").classList.toggle("open",addOpen);}
function addBook(){
  const t=document.getElementById("f-t").value.trim();if(!t)return;
  const a=document.getElementById("f-a").value.trim();
  const y=parseInt(document.getElementById("f-y").value)||null;
  const e=document.getElementById("f-e").value;
  const s=document.getElementById("f-s").value;
  const b={id:"u-"+Date.now(),t,a,y,e,s,L:["mes livres"]};
  if(e==="Terminé"){b.fd=tod;b.rc=0;b.lr=null;}
  books.unshift(b);
  document.getElementById("f-t").value="";document.getElementById("f-a").value="";document.getElementById("f-y").value="";
  save();
}

function openEdit(id){
  editId=id;const b=books.find(x=>x.id===id);if(!b)return;
  document.getElementById("e-t").value=b.t||"";
  document.getElementById("e-a").value=b.a||"";
  document.getElementById("e-y").value=b.y||"";
  document.getElementById("e-e").value=b.e||"Envie";
  document.getElementById("e-s").value=b.s||"";
  const bl=b.L||[];
  document.getElementById("e-lbls").innerHTML=labels.map(l=>`<span class="echip ${bl.includes(l)?"on":""}" onclick="this.classList.toggle('on')">${l}</span>`).join("");
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal(){document.getElementById("modal-overlay").classList.remove("open");editId=null;}
function saveEdit(){
  const b=books.find(x=>x.id===editId);if(!b)return;
  b.t=document.getElementById("e-t").value.trim()||b.t;
  b.a=document.getElementById("e-a").value.trim();
  b.y=parseInt(document.getElementById("e-y").value)||null;
  const ne=document.getElementById("e-e").value;
  if(ne==="Terminé"&&b.e!=="Terminé"){b.fd=b.fd||tod;b.rc=b.rc||0;}
  b.e=ne;b.s=document.getElementById("e-s").value;
  b.L=[...document.getElementById("e-lbls").querySelectorAll(".echip.on")].map(el=>el.textContent);
  closeModal();save();
}
function delBook(){
  if(!confirm(`Supprimer "${books.find(x=>x.id===editId)?.t}" ?`))return;
  books=books.filter(x=>x.id!==editId);closeModal();save();
}

function toggleLblMgr(){lmOpen=!lmOpen;document.getElementById("lbl-mgr").classList.toggle("open",lmOpen);}
function renderLM(){document.getElementById("lbl-list").innerHTML=labels.map(l=>`<span class="lbl-chip">${l} <span class="lbl-del" onclick="delLbl('${l}')">✕</span></span>`).join("");}
function addLbl(){const v=document.getElementById("new-lbl-in").value.trim();if(!v||labels.includes(v))return;labels.push(v);document.getElementById("new-lbl-in").value="";save();}
function delLbl(l){if(!confirm(`Supprimer le label "${l}" ?`))return;labels=labels.filter(x=>x!==l);books.forEach(b=>{b.L=(b.L||[]).filter(x=>x!==l);});save();}

load();
</script>
</body>
</html>
